<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <title>DriveMatrix WiFi Setup</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #000; color: #fff; font-family: sans-serif; }
        .metallic-finish { background: linear-gradient(145deg, #18181b, #09090b); border: 1px solid rgba(255,255,255,0.1); }
        .skew-button { transform: skewX(-12deg); transition: all 0.2s ease; cursor: pointer; }
        .skew-button:hover { transform: skewX(-12deg) scale(1.02); }
        .skew-content { transform: skewX(12deg); display: inline-block; width: 100%; text-align: center; }
    </style>
</head>
<body class="antialiased min-h-screen flex flex-col justify-center items-center px-6">
    <div class="max-w-md w-full">
        <div class="text-center mb-8">
            <h1 class="text-3xl font-black uppercase italic tracking-tighter">
                Network <span class="text-red-600">Config</span>
            </h1>
            <div class="h-1 bg-red-600 mx-auto w-16 mt-2"></div>
        </div>
        
        <div class="metallic-finish p-8 rounded-xl shadow-2xl flex flex-col gap-6">
            <div class="bg-black/50 p-4 border border-white/5 flex flex-col items-center rounded">
                <span class="text-xs uppercase tracking-widest text-white/50 mb-1">Current Connection</span>
                <span class="text-lg font-black text-green-500">{{ current_wifi }}</span>
            </div>

            <form action="/connect" method="post" class="flex flex-col gap-4">
                <div>
                    <label class="text-xs font-bold uppercase tracking-widest text-white/70 block mb-2">Select Network</label>
                    <select name="ssid" class="bg-zinc-900 border border-white/20 text-white p-3 font-medium focus:border-red-600 focus:outline-none w-full rounded">
                        {% for net, signal in networks %}
                            <option value="{{ net }}">{{ net }} ({{ signal }}%)</option>
                        {% endfor %}
                    </select>
                </div>

                <div>
                    <input type="text" name="custom_ssid" placeholder="Custom SSID (Optional)" class="bg-zinc-900 border border-white/20 text-white p-3 font-medium focus:border-red-600 focus:outline-none w-full rounded">
                </div>

                <div>
                    <input type="password" name="password" placeholder="Password (Leave blank if saved)" class="bg-zinc-900 border border-white/20 text-white p-3 font-medium focus:border-red-600 focus:outline-none w-full rounded">
                </div>
                
                <button type="submit" class="bg-red-600 text-white py-3 mt-4 skew-button font-black uppercase tracking-widest text-sm w-full rounded">
                    <span class="skew-content">Connect</span>
                </button>
            </form>
            
            <button onclick="location.reload()" class="border border-white/20 text-white py-3 skew-button font-black uppercase tracking-widest text-sm w-full hover:border-white/50 rounded">
                <span class="skew-content">Refresh Networks</span>
            </button>
        </div>
    </div>
</body>
</html>
